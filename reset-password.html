<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex'><title>Reset Augusta Gallery password</title></head><body><main><h1>Set a new gallery password</h1><p id='message'>Loading secure reset…</p><form id='reset-form' hidden><label>New password <input id='password' type='password' minlength='8' autocomplete='new-password' required></label><label>Confirm password <input id='confirm' type='password' minlength='8' autocomplete='new-password' required></label><button id='submit' type='submit'>Save new password</button></form></main><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='admin/config.js'></script><script>(()=>{const cfg=window.AUGUSTA_MEDIA_CONFIG||{},form=document.getElementById('reset-form'),message=document.getElementById('message'),button=document.getElementById('submit');if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase){message.textContent='The secure service is unavailable. Please request a new reset email.';return;}const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);db.auth.getSession().then(({data})=>{if(data.session){form.hidden=false;message.textContent='Choose a strong new password.';}else message.textContent='This link is invalid or expired. Request a fresh password reset email.';});form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){message.textContent='The passwords do not match.';return;}button.disabled=true;const {error}=await db.auth.updateUser({password});if(error){message.textContent=error.message;button.disabled=false;return;}form.hidden=true;message.innerHTML='Password updated. <a href="admin/">Open the Gallery Manager</a>.';});})();</script></body></html>
