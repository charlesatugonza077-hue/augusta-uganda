<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#123d35">
  <title>Reset Augusta Gallery password</title>
  <style>
    :root{color-scheme:light;--deep:#163b32;--paper:#faf8f2;--line:#dce2d9;--muted:#65736b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:#263630;font:16px/1.55 system-ui,sans-serif}
    main{width:min(100%,480px);padding:32px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 18px 45px rgba(22,59,50,.1)}
    h1{margin:0 0 10px;color:var(--deep);font-size:30px;line-height:1.1;letter-spacing:-.05em}
    form{display:grid;gap:15px;margin-top:22px}label{display:grid;gap:7px;font-weight:700;font-size:14px}
    input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}
    button{min-height:46px;padding:11px 16px;border:0;border-radius:999px;background:var(--deep);color:#fff;font:inherit;font-weight:800;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}a{color:var(--deep);font-weight:700}
    .skip{position:absolute;left:-9999px;top:8px}.skip:focus{left:12px;padding:10px;background:#fff}
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="main">
    <h1>Set a new gallery password</h1>
    <p id="message" role="status" aria-live="polite">Loading secure reset…</p>
    <form id="reset-form" hidden>
      <label for="password">New password
        <input id="password" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label for="confirm">Confirm password
        <input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <button id="submit" type="submit">Save new password</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin/config.js"></script>
  <script>
    (() => {
      const cfg = window.AUGUSTA_MEDIA_CONFIG || {};
      const form = document.getElementById("reset-form");
      const message = document.getElementById("message");
      const button = document.getElementById("submit");
      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) {
        message.textContent = "The secure service is unavailable. Please request a new reset email.";
        return;
      }
      const db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      db.auth.getSession().then(({ data }) => {
        if (data.session) {
          form.hidden = false;
          message.textContent = "Choose a strong new password.";
        } else {
          message.textContent = "This link is invalid or expired. Request a fresh password reset email.";
        }
      });
      form.addEventListener("submit", async event => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        if (password !== document.getElementById("confirm").value) {
          message.textContent = "The passwords do not match.";
          return;
        }
        button.disabled = true;
        const { error } = await db.auth.updateUser({ password });
        if (error) {
          message.textContent = error.message;
          button.disabled = false;
          return;
        }
        form.hidden = true;
        message.textContent = "Password updated successfully.";
        const link = document.createElement("a");
        link.href = "admin/";
        link.textContent = "Open the Gallery Manager";
        message.append(" ", link);
      });
    })();
  </script>
</body>
</html>
