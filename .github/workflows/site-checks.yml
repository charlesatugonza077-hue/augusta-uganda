name: Free site checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate HTML references and sitemap
        run: python scripts/site_check.py
      - name: Check browser JavaScript syntax
        run: |
          node --check assets/js/config.js
          node --check assets/js/site.js
          node --check assets/js/gallery.js
          node --check admin/admin.js
          node --check admin/forgot-password.js
          node --check admin/operations.js
          node --check assets/js/homepage-portfolio.js
      - name: Test optional enquiry Worker source
        run: |
          node --check backend/enquiry-worker/src/index.js
          node backend/enquiry-worker/test/enquiry-worker.test.mjs
