name: Deploy Augusta enquiry backend

on:
  push:
    branches: [main, feature/deploy-augusta-backend]
    paths:
      - "backend/enquiry-worker/**"
      - ".github/workflows/deploy-enquiry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/enquiry-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Verify deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAIL_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.ENQUIRY_FROM_EMAIL }}
          MAIL_TO: ${{ secrets.ENQUIRY_TO_EMAIL }}
        run: |
          missing=0
          for item in CF_TOKEN CF_ACCOUNT MAIL_KEY MAIL_FROM MAIL_TO; do
            if [ -z "${!item}" ]; then
              echo "::error::Missing GitHub Actions secret: ${item}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the five required repository secrets, then rerun this workflow."
            exit 1
          fi
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Configure Worker mail secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ENQUIRY_FROM_EMAIL: ${{ secrets.ENQUIRY_FROM_EMAIL }}
          ENQUIRY_TO_EMAIL: ${{ secrets.ENQUIRY_TO_EMAIL }}
        run: |
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          printf '%s' "$ENQUIRY_FROM_EMAIL" | npx wrangler secret put ENQUIRY_FROM_EMAIL
          printf '%s' "$ENQUIRY_TO_EMAIL" | npx wrangler secret put ENQUIRY_TO_EMAIL
